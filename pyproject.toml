[project]
name = "surfacewatch"
version = "0.1.0"
description = "Free EASM scanning service with report generation, built on BBOT"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "pydantic-settings>=2.2",
    "dnspython>=2.6",
    "redis>=5.0",
    "rq>=1.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "cryptography>=42",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
