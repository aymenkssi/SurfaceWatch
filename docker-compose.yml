services:
  web:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [redis, db]
    volumes: ["scans:/srv/data"]

  worker:
    build: .
    env_file: .env
    command: ["rq", "worker", "scans", "--url", "redis://redis:6379/0"]
    depends_on: [redis, db]
    volumes: ["scans:/srv/data"]

  redis:
    image: redis:7-alpine

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surfacewatch
      POSTGRES_PASSWORD: surfacewatch
      POSTGRES_DB: surfacewatch
    volumes: ["pgdata:/var/lib/postgresql/data"]

volumes:
  scans:
  pgdata:
